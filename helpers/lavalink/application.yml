server:
  port: ${SERVER_PORT:2333}
  address: 0.0.0.0

dev:
  lavalink:
    youtube:
      http:
        YouTubeOAuth2Handler: "INFO"

lavalink:
  server:
    password: ${LAVALINK_SERVER_PASSWORD}
    # Seconds between position reports. The Activity holds its clock until
    # the first report shows audio moving, so a long gap reads as a late start.
    playerUpdateInterval: 1
    sources:
      youtube: false # Disabled - using LavaSrc YouTube instead
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: false
      local: false
    bufferDurationMs: 400
    resamplingQuality: HIGH
    # Ready-to-send Opus frames. A deeper buffer rides out GC pauses, CPU
    # contention on the Pi and short upstream stalls; filter/EQ changes take
    # up to this long to be heard.
    frameBufferDurationMs: 2500
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
  plugins:
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    - dependency: "dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3"
      repository: "https://maven.lavalink.dev/snapshots"
      snapshot: true
    - dependency: "com.github.topi314.lavalyrics:lavalyrics-plugin:1.1.0"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

logging:
  # POST /youtube and /youtube/oauth carry the poToken and refresh token in the
  # body, so request bodies stay out of the log files.
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: false
  file:
    path: ./logs/
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 25MB
      total-size-cap: 500MB

plugins:
  lavalyrics:
    sources: # Priority order for lyrics sources (tries in this order)
      - deezer # Try Deezer's native lyrics first
      - spotify # Then Spotify lyrics
      - youtube # Then YouTube lyrics
      # LRCLIB is automatic fallback when above sources don't have lyrics
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - MWEB
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
      - TV
      - TVHTML5_SIMPLY
    # OAuth is the active authenticated path. Do not mix it with the old
    # cookies.file setting: current youtube-source accepts oauth.cookie as a
    # value, not a Netscape cookie-file mount.
    oauth:
      enabled: true
      refreshToken: ${YOUTUBE_REFRESH_TOKEN:}
    # OAuth only covers the TV clients. Without a poToken the WEB/MWEB streams
    # are refused (403) or start and die mid-song, which leaves a single TV
    # client between a song and a skip. Empty unless the deployment sets them.
    pot:
      token: ${YOUTUBE_PO_TOKEN:}
      visitorData: ${YOUTUBE_VISITOR_DATA:}
    remoteCipher:
      # yt-cipher is self-hosted in Compose; it keeps YouTube player-script
      # signature changes out of the Lavalink process.
      url: http://yt-cipher:8001
      password: ${YT_CIPHER_API_TOKEN:}
      userAgent: MewBit-Lavalink
  lavasrc:
    providers: # Mirrors for Spotify and other metadata-only sources.
      # Spotify itself never provides audio; resolve the recording on YouTube
      # first, using its ISRC when present. Deezer is intentionally not here:
      # its direct media endpoint can deny a valid Spotify match with a 403,
      # which otherwise turns into a loose bot-side fallback.
      - 'ytsearch:"%ISRC%"'
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: true
      deezer: true
      youtube: true
      ytmsearch: true
    lyrics-sources:
      deezer: true
      spotify: false # Disabled - LavaSrc can't extract Spotify secret from current web player
      youtube: true
      yandexmusic: false
      vkmusic: false
      lrcLib: true
    spotify:
      clientId: ${SPOTIFY_CLIENT_ID}
      clientSecret: ${SPOTIFY_CLIENT_SECRET}
      spDc: ${SPOTIFY_SP_DC}
      countryCode: PL
      playlistPageSize: 100
    deezer:
      arl: ${DEEZER_ARL_TOKEN}
      masterDecryptionKey: ${DEEZER_MASTER_KEY}
      formats: ["FLAC", "MP3_320", "MP3_256", "MP3_128"]
