services:
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    environment:
      API_TOKEN: ${YT_CIPHER_API_TOKEN:-}
      OVERRIDE_PLAYER_VARIANT: IAS
    restart: unless-stopped

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: mewbit-lavalink
    env_file:
      - .env
    environment:
      SERVER_PORT: 2333
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in .env}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      YOUTUBE_PO_TOKEN: ${YOUTUBE_PO_TOKEN:-}
      YOUTUBE_VISITOR_DATA: ${YOUTUBE_VISITOR_DATA:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      YT_CIPHER_API_TOKEN: ${YT_CIPHER_API_TOKEN:-}
      DEEZER_ARL_TOKEN: ${DEEZER_ARL_TOKEN:-}
      DEEZER_MASTER_KEY: ${DEEZER_MASTER_KEY:-}
    volumes:
      - ./helpers/lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./helpers/lavalink/plugins:/opt/Lavalink/plugins
      - ./helpers/lavalink/youtube-cookies.txt:/opt/Lavalink/youtube-cookies.txt:ro
    ports:
      - "127.0.0.1:${LAVALINK_PUBLIC_PORT:-2333}:2333"
    restart: unless-stopped
    depends_on:
      yt-cipher:
        condition: service_started
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'curl -sf -H "Authorization: ${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in .env}" http://localhost:2333/version || exit 1'
      interval: 15s
      timeout: 5s
      retries: 5

  bot:
    image: marczelloo/neo-beat-buddy:latest
    # Built on the Pi from this checkout by the dashboard deploy agent.
    build:
      context: .
      dockerfile: dockerfile
    depends_on:
      lavalink:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ACTIVITY_HOST: ${ACTIVITY_HOST:-0.0.0.0}
      ACTIVITY_PORT: ${ACTIVITY_PORT:-8787}
    ports:
      # Keep Activity private for the Cloudflare tunnel and avoid the Dashboard
      # runner, which already owns localhost:8787 on the Raspberry Pi.
      - "127.0.0.1:${ACTIVITY_PUBLIC_PORT:-8788}:${ACTIVITY_PORT:-8787}"
    volumes:
      - ./helpers/data:/app/helpers/data # Persist data across restarts
      - ./logs:/app/logs
    restart: unless-stopped
