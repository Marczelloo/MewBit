services:
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    environment:
      API_TOKEN: ${YT_CIPHER_API_TOKEN:-}
      OVERRIDE_PLAYER_VARIANT: IAS
    restart: unless-stopped

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: mewbit-lavalink
    env_file:
      - .env
    environment:
      SERVER_PORT: 2333
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in .env}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      YOUTUBE_PO_TOKEN: ${YOUTUBE_PO_TOKEN:-}
      YOUTUBE_VISITOR_DATA: ${YOUTUBE_VISITOR_DATA:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      YT_CIPHER_API_TOKEN: ${YT_CIPHER_API_TOKEN:-}
      DEEZER_ARL_TOKEN: ${DEEZER_ARL_TOKEN:-}
      DEEZER_MASTER_KEY: ${DEEZER_MASTER_KEY:-}
      # Fixed heap and short GC pauses keep the audio frame loop steady.
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1g -XX:+UseG1GC -XX:MaxGCPauseMillis=50"
    # Audio wins CPU contention against builds and other containers on the Pi.
    cpu_shares: 2048
    volumes:
      - ./helpers/lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./helpers/lavalink/plugins:/opt/Lavalink/plugins
      - ./helpers/lavalink/youtube-cookies.txt:/opt/Lavalink/youtube-cookies.txt:ro
    ports:
      - "127.0.0.1:${LAVALINK_PUBLIC_PORT:-2333}:2333"
    restart: unless-stopped
    depends_on:
      yt-cipher:
        condition: service_started
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'curl -sf -H "Authorization: ${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in .env}" http://localhost:2333/version || exit 1'
      interval: 15s
      timeout: 5s
      retries: 5

  # Melody decoder for mewbeat (Basic Pitch on onnxruntime). The bot POSTs the bytes of a track and gets the melody JSON back; it is
  # reachable on the compose network only, nothing is published. One decode at a time, the model unloads after a few idle minutes.
  mewbeat-decoder:
    image: mewbeat-decoder-svc:latest
    build:
      context: ./scripts/mewbeat-melody/decoder
    environment:
      MEWBEAT_DECODER_THREADS: 2
      MEWBEAT_DECODER_IDLE_MIN: 5
    # Two cores and a bounded memory: a decode of a 20 minute track peaks near 1.1 GB, a 3 minute one near 0.4 GB.
    cpus: 2
    mem_limit: 2g
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8090/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    image: marczelloo/neo-beat-buddy:latest
    # Built on the Pi from this checkout by the dashboard deploy agent.
    build:
      context: .
      dockerfile: dockerfile
    depends_on:
      lavalink:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # The Lavalink service above, whatever .env says: inside this stack it has no other address.
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: 2333
      # The clock the logs and the AI DJ's time of day use.
      TZ: ${TZ:-UTC}
      ACTIVITY_HOST: ${ACTIVITY_HOST:-0.0.0.0}
      ACTIVITY_PORT: ${ACTIVITY_PORT:-8787}
      # The melody decoder service above. Not in depends_on on purpose: the bot retries a decode later when the service is down.
      MEWBEAT_DECODER_URL: http://mewbeat-decoder:8090
    ports:
      # Keep Activity private for the Cloudflare tunnel and avoid the Dashboard
      # runner, which already owns localhost:8787 on the Raspberry Pi.
      - "127.0.0.1:${ACTIVITY_PUBLIC_PORT:-8788}:${ACTIVITY_PORT:-8787}"
    volumes:
      - ./helpers/data:/app/helpers/data # Persist data across restarts
      - ./logs:/app/logs
    restart: unless-stopped
