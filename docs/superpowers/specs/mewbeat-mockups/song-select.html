<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MewBit Beat — mockup wyboru utworu</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050608; --surface: #0c0e12; --raised: #111318; --high: #161920;
    --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.14); --text: #f4f6f9; --muted: #9ba4b2; --faint: #667081;
    --cyan: #67e3f4; --violet: #a78bfa; --pink: #ff6ec7; --danger: #ff8098;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--text); font-family: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif; overflow: hidden;
    background:
      radial-gradient(90% 60% at 100% 0%, rgba(167,139,250,.10), transparent 60%),
      radial-gradient(70% 60% at 0% 100%, rgba(255,110,199,.08), transparent 60%),
      var(--bg); }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .lbl { font: 500 10px "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  button { font: inherit; color: inherit; }

  .app { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(320px, 460px); height: 100%; }

  /* ---------- left: selected track ---------- */
  .detail { display: flex; flex-direction: column; min-height: 0; padding: 18px 20px 0; gap: 14px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .back { background: var(--raised); border: 0; outline: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .brand { font-weight: 900; letter-spacing: -.02em; font-size: 15px; }
  .brand span { color: var(--pink); }
  .gear { margin-left: auto; }

  .hero { display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: end; }
  .cover { width: 132px; aspect-ratio: 1; border-radius: 18px; outline: 1px solid var(--line-strong); position: relative; overflow: hidden; }
  .cover::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.06) 0 2px, transparent 2px 9px); }
  .hero h2 { margin: 6px 0 2px; font-size: clamp(22px, 2.6vw, 30px); font-weight: 900; letter-spacing: -.03em; line-height: 1.05; }
  .hero .artist { color: var(--muted); font-size: 14px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font: 500 11px "JetBrains Mono", monospace; color: var(--muted); background: var(--raised); outline: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }

  .diffs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .diff { text-align: left; background: var(--surface); border: 0; outline: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
  .diff b { display: block; font-size: 14px; font-weight: 800; }
  .diff small { color: var(--faint); font-size: 11.5px; }
  .diff .bar { height: 3px; border-radius: 2px; background: var(--high); margin-top: 8px; overflow: hidden; }
  .diff .bar i { display: block; height: 100%; background: var(--c); }
  .diff.on { outline: 2px solid var(--c); background: var(--raised); }
  .d0 { --c: var(--cyan); } .d1 { --c: var(--violet); } .d2 { --c: var(--pink); }

  .board { flex: 1; min-height: 0; display: flex; flex-direction: column; background: rgba(12,14,18,.7); outline: 1px solid var(--line); border-radius: 18px 18px 0 0; }
  .boardHead { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .seg { display: inline-flex; background: var(--bg); outline: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-left: auto; }
  .seg button { border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--text); color: var(--bg); }
  .rows { overflow: auto; padding: 6px 8px 10px; }
  .row { display: grid; grid-template-columns: 26px 26px minmax(0, 1fr) 20px auto auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 10px; font-size: 13px; }
  .row:nth-child(odd) { background: rgba(255,255,255,.015); }
  .row.me { outline: 1px solid rgba(103,227,244,.35); }
  .row .rk { font: 700 12px "JetBrains Mono", monospace; color: var(--faint); text-align: right; }
  .row:nth-child(1) .rk { color: #ffd479; } .row:nth-child(2) .rk { color: #d5dbe5; } .row:nth-child(3) .rk { color: #e3a27a; }
  .row .av { width: 26px; height: 26px; border-radius: 50%; background: var(--high); outline: 1px solid var(--line); display: grid; place-items: center; font-size: 10px; font-weight: 800; }
  .row .nm small { color: var(--faint); font-size: 11px; margin-left: 6px; }
  .row .acc { font: 500 12px "JetBrains Mono", monospace; color: var(--muted); }
  .row .sc { font: 700 13px "JetBrains Mono", monospace; min-width: 84px; text-align: right; }
  .grade { font-weight: 900; font-size: 13px; width: 20px; text-align: center; }

  /* ---------- right: carousel ---------- */
  .list { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: rgba(5,6,8,.55); }
  .tabs { display: flex; gap: 2px; padding: 14px 14px 0; }
  .tab { border: 0; background: transparent; padding: 8px 10px; font-size: 13px; font-weight: 700; color: var(--faint); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.on { color: var(--text); border-color: var(--cyan); }
  .filters { display: flex; gap: 8px; padding: 10px 14px; align-items: center; }
  .search { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--surface); outline: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; color: var(--faint); font-size: 13px; }
  .search .caret { width: 1px; height: 14px; background: var(--cyan); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .songs { flex: 1; overflow: auto; padding: 6px 0 14px; perspective: 900px; }
  .song { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; margin: 6px 14px 6px 28px; padding: 9px 12px 9px 9px;
    background: var(--surface); outline: 1px solid var(--line); border-radius: 14px; cursor: pointer;
    transition: transform .22s cubic-bezier(.2,.8,.2,1), background .2s; }
  .song:hover { transform: translateX(-6px); }
  .song.on { transform: translateX(-20px); background: var(--raised); outline: 2px solid var(--pink); }
  .song .art { width: 52px; aspect-ratio: 1; border-radius: 10px; }
  .song b { display: block; font-size: 14px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song small { color: var(--muted); font-size: 12px; }
  .song .info { min-width: 0; }
  .song .side { text-align: right; }
  .song .plays { font: 500 11px "JetBrains Mono", monospace; color: var(--faint); display: block; }
  .dots { display: inline-flex; gap: 3px; margin-top: 5px; }
  .dots i { width: 7px; height: 7px; border-radius: 2px; background: var(--high); }
  .dots i.d0 { background: var(--cyan); } .dots i.d1 { background: var(--violet); } .dots i.d2 { background: var(--pink); }
  .new { font: 700 9.5px "JetBrains Mono", monospace; letter-spacing: .08em; color: var(--bg); background: var(--cyan); border-radius: 5px; padding: 2px 5px; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 14px 14px; border-top: 1px solid var(--line); background: rgba(5,6,8,.9); }
  .act { border: 0; border-radius: 12px; padding: 13px 14px; font-size: 14px; font-weight: 800; cursor: pointer; }
  .act.primary { background: var(--text); color: var(--bg); }
  .act.secondary { background: var(--raised); outline: 1px solid var(--line-strong); color: var(--text); }
  .act small { display: block; font-size: 11px; font-weight: 500; opacity: .65; margin-top: 2px; }
  .gen { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .gen i { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); }
  .gen.pending i { background: #ffd479; }
</style>
</head>
<body>
<div class="app">
  <section class="detail">
    <div class="top">
      <button class="back">← Wróć do odtwarzacza</button>
      <span class="brand">mew<span>beat</span></span>
      <button class="back gear">⚙ Ustawienia</button>
    </div>

    <div class="hero">
      <div class="cover" id="cover"></div>
      <div>
        <span class="lbl" id="srcLbl">biblioteka · grane 48× na serwerze</span>
        <h2 id="title">Neon Afterglow</h2>
        <div class="artist" id="artist">Przykładowy artysta</div>
        <div class="meta">
          <span class="chip" id="len">3:42</span><span class="chip" id="bpm">126 BPM</span><span class="chip">YouTube</span>
        </div>
      </div>
    </div>

    <div class="diffs" id="diffs">
      <button class="diff d0" data-d="0"><b>Easy</b><small id="n0">212 nut · ★ 1.8</small><div class="bar"><i style="width:30%"></i></div></button>
      <button class="diff d1 on" data-d="1"><b>Normal</b><small id="n1">418 nut · ★ 3.4</small><div class="bar"><i style="width:58%"></i></div></button>
      <button class="diff d2" data-d="2"><b>Hard</b><small id="n2">702 nut · ★ 5.1</small><div class="bar"><i style="width:88%"></i></div></button>
    </div>

    <div class="board">
      <div class="boardHead">
        <span class="lbl" id="boardLbl">ranking · normal</span>
        <div class="seg" id="scope">
          <button class="on" data-s="server">Ten serwer</button><button data-s="global">Globalnie</button><button data-s="me">Moje wyniki</button>
        </div>
      </div>
      <div class="rows" id="rows"></div>
    </div>
  </section>

  <aside class="list">
    <div class="tabs" id="tabs">
      <button class="tab on" data-t="lib">Biblioteka</button>
      <button class="tab" data-t="hist">Moja historia</button>
      <button class="tab" data-t="search">Szukaj nowej</button>
    </div>
    <div class="filters">
      <div class="search">⌕ <span id="ph">Szukaj w zagranych utworach</span><span class="caret"></span></div>
      <div class="seg" id="libScope" style="margin-left:0">
        <button class="on">Serwer</button><button>Globalnie</button>
      </div>
    </div>
    <div class="songs" id="songs"></div>
    <div class="actions">
      <div class="gen" id="gen"><i></i><span id="genTxt">Poziomy gotowe — utwór był już analizowany</span></div>
      <button class="act primary">Puść teraz<small>krótka poczekalnia, potem start</small></button>
      <button class="act secondary">Dodaj do kolejki<small>gra startuje, gdy przyjdzie kolej</small></button>
    </div>
  </aside>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const songs = [
    { t: "Neon Afterglow", a: "Przykładowy artysta", len: "3:42", bpm: 126, plays: 48, h: [320, 300], diff: [1.8, 3.4, 5.1], best: 2 },
    { t: "Midnight Arcade", a: "Synth Kitty", len: "4:05", bpm: 140, plays: 31, h: [190, 260], diff: [2.1, 3.9, 5.8], best: 1 },
    { t: "Paper Lanterns", a: "Lo-Fi Ghost", len: "2:58", bpm: 84, plays: 22, h: [30, 50], diff: [1.2, 2.4, 3.6], best: 0 },
    { t: "Glass Heart (Remix)", a: "NIGHTDRIVE", len: "3:31", bpm: 128, plays: 17, h: [280, 210], diff: [2.4, 4.2, 6.0], best: -1 },
    { t: "Kitsune Rush", a: "Ame & Rei", len: "2:44", bpm: 174, plays: 12, h: [350, 20], diff: [3.0, 4.8, 6.7], best: 2 },
    { t: "Slow Static", a: "Vapor Fields", len: "5:12", bpm: 96, plays: 9, h: [210, 170], diff: [1.5, 2.9, 4.4], best: 0 },
    { t: "Overclocked", a: "Byte Theory", len: "3:18", bpm: 150, plays: 6, h: [160, 330], diff: [2.6, 4.5, 6.2], best: -1 },
    { t: "Summer Pixel", a: "Chiptune Club", len: "2:21", bpm: 132, plays: 4, h: [50, 110], diff: [2.0, 3.5, 5.0], best: 1 },
  ];
  const art = (h) => `linear-gradient(135deg, hsl(${h[0]} 80% 55%), hsl(${h[1]} 70% 22%))`;
  const names = ["kuba", "ola_", "Ty", "mrq", "zuzia", "nocny_kot", "pixelpaw", "dj_ziemniak", "lena", "wojtas"];
  const grades = [["S", "#ffd479"], ["A", "#67e3f4"], ["A", "#67e3f4"], ["B", "#a78bfa"], ["B", "#a78bfa"], ["C", "#9ba4b2"]];
  let sel = 0, diff = 1, scope = "server";

  function renderSongs() {
    $("songs").innerHTML = songs.map((s, i) => `
      <div class="song ${i === sel ? "on" : ""}" data-i="${i}">
        <div class="art" style="background:${art(s.h)}"></div>
        <div class="info"><b>${s.t}</b><small>${s.a}</small>
          <div class="dots">${[0, 1, 2].map((d) => `<i class="${d <= s.best ? "d" + d : ""}"></i>`).join("")}</div></div>
        <div class="side">${s.plays < 5 ? '<span class="new">NOWE</span>' : ""}<span class="plays">${s.plays}× · ${s.len}</span></div>
      </div>`).join("");
  }
  function renderBoard() {
    const s = songs[sel], seedBase = sel * 31 + diff * 7 + (scope === "global" ? 100 : 0);
    let seed = seedBase + 1; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const count = scope === "me" ? 5 : 10;
    let sc = 980000 - diff * 20000 - rnd() * 30000;
    const pool = scope === "global" ? ["neonfox", "kuba", "arcadia", "Ty", "rhythm_rin", "ola_", "beatcat", "vex", "mrq", "lumi"] : names;
    const rows = [];
    for (let i = 0; i < count; i++) {
      sc -= 6000 + rnd() * 28000;
      const n = scope === "me" ? "Ty" : pool[i % pool.length];
      const g = grades[Math.min(grades.length - 1, Math.floor(i / 2))];
      const srv = scope === "global" ? `<small>${["Kocia Piwnica", "Neon Hub", "Lofi Den"][i % 3]}</small>` : scope === "me" ? `<small>${i + 2} dni temu</small>` : "";
      rows.push(`<div class="row ${n === "Ty" ? "me" : ""}"><span class="rk">${i + 1}</span><span class="av">${n[0].toUpperCase()}</span>
        <span class="nm">${n}${srv}</span><span class="grade" style="color:${g[1]}">${g[0]}</span>
        <span class="acc">${(99.2 - i * 1.1 - rnd()).toFixed(2)}%</span><span class="sc">${Math.round(sc).toLocaleString("pl-PL")}</span></div>`);
    }
    $("rows").innerHTML = rows.join("");
    $("boardLbl").textContent = `ranking · ${["easy", "normal", "hard"][diff]}`;
  }
  function renderDetail() {
    const s = songs[sel];
    $("cover").style.background = art(s.h); $("title").textContent = s.t; $("artist").textContent = s.a;
    $("len").textContent = s.len; $("bpm").textContent = s.bpm + " BPM";
    $("srcLbl").textContent = `biblioteka · grane ${s.plays}× na serwerze`;
    s.diff.forEach((v, d) => ($("n" + d).textContent = `${Math.round(v * 120 + 0)} nut · ★ ${v.toFixed(1)}`));
    renderBoard();
  }
  $("songs").addEventListener("click", (e) => { const el = e.target.closest(".song"); if (!el) return; sel = +el.dataset.i; renderSongs(); renderDetail(); });
  $("diffs").addEventListener("click", (e) => { const el = e.target.closest(".diff"); if (!el) return;
    diff = +el.dataset.d; document.querySelectorAll(".diff").forEach((b) => b.classList.toggle("on", b === el)); renderBoard(); });
  $("scope").addEventListener("click", (e) => { const el = e.target.closest("button"); if (!el) return;
    scope = el.dataset.s; $("scope").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === el)); renderBoard(); });
  $("libScope").addEventListener("click", (e) => { const el = e.target.closest("button"); if (!el) return;
    $("libScope").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === el)); });
  $("tabs").addEventListener("click", (e) => { const el = e.target.closest(".tab"); if (!el) return;
    document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b === el));
    const t = el.dataset.t;
    $("ph").textContent = { lib: "Szukaj w zagranych utworach", hist: "Szukaj w swojej historii", search: "Wpisz tytuł — YouTube, Spotify, Deezer…" }[t];
    $("libScope").style.display = t === "lib" ? "" : "none";
    const g = $("gen");
    g.classList.toggle("pending", t === "search");
    $("genTxt").textContent = t === "search" ? "Nowy utwór — poziomy wygenerują się w kilka sekund po wybraniu" : "Poziomy gotowe — utwór był już analizowany";
    if (window.toggleSelect) window.toggleSelect(el);
  });
  renderSongs(); renderDetail();
})();
</script>
</body>
</html>
