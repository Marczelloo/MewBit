<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mewbeat · test odsłuchowy</title>
<style>
:root {
  --bg: #14161a;
  --panel: #1a1d23;
  --row2: #20242b;
  --line: #2c313a;
  --text: #d8dce2;
  --dim: #8a919c;
  --accent: #5aa9ff;
  --warn: #ffb454;
  --bad: #ff6b6b;
  --playhead: #ff4d6d;
  --wave: #6f8fb3;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 system-ui, "Segoe UI", sans-serif;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}
main { max-width: 760px; margin: 0 auto; padding: 12px 16px 32px; display: flex; flex-direction: column; gap: 14px; }
.tnum, button, input, select { font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); }

button, select {
  background: var(--row2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 6px;
  font: inherit;
  padding: 8px 12px;
  min-height: 48px;
  touch-action: manipulation;
}
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--dim); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { width: 100%; min-width: 0; }

h2 { margin: 0 0 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }

#status { min-height: 22px; font-size: 14px; color: var(--dim); }
#status progress { display: block; width: 100%; height: 8px; margin-top: 6px; accent-color: var(--accent); }
#error { background: #4a1d1d; color: #ffd5d5; border: 1px solid var(--bad); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
#error[hidden], #status progress[hidden] { display: none; }

#transport { display: flex; flex-direction: column; align-items: center; gap: 10px; }
#timeNow { font-size: 56px; font-weight: 600; line-height: 1; }
#timeTotal { font-size: 18px; margin-left: 6px; }
#controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; width: 100%; }
#playBtn { font-size: 20px; font-weight: 600; min-height: 60px; background: var(--accent); color: #0b1220; border-color: var(--accent); }
#playBtn:disabled { background: var(--row2); color: var(--text); border-color: var(--line); }

.group { display: flex; flex-direction: column; }
.tracks { display: grid; grid-template-columns: repeat(auto-fit, minmax(76px, 1fr)); gap: 8px; }
.tracks button { min-height: 56px; font-size: 18px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; line-height: 1.15; overflow-wrap: anywhere; }
.tracks button.ref { font-size: 13px; overflow-wrap: normal; padding-inline: 4px; }
.tracks button[aria-pressed=true] { background: var(--accent); color: #0b1220; border-color: var(--accent); }
.tracks kbd { font: inherit; font-size: 11px; font-weight: 400; opacity: .65; }

#timeline { position: relative; height: 72px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; overflow: hidden; touch-action: manipulation; }
#tl { display: block; width: 100%; height: 100%; }
#playhead { position: absolute; top: 0; bottom: 0; left: 0; width: 2px; margin-left: -1px; background: var(--playhead); pointer-events: none; will-change: transform; }

#volumes { display: grid; grid-template-columns: 1fr; gap: 10px; }
.vol { display: grid; grid-template-columns: 88px 1fr; align-items: center; gap: 10px; color: var(--dim); min-height: 44px; }
.vol input { width: 100%; min-width: 0; height: 32px; accent-color: var(--accent); }
.keys { font-size: 12px; color: var(--dim); }
.keys kbd { font: inherit; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }

@media (min-width: 560px) {
  #volumes { grid-template-columns: 1fr 1fr; gap: 20px; }
  #timeNow { font-size: 72px; }
}
</style>
</head>
<body>
<main>
  <section class="group">
    <h2>Utwór</h2>
    <select id="songSel" aria-label="Utwór" disabled><option>Ładuję listę…</option></select>
    <div id="status" class="tnum" role="status" aria-live="polite"><span id="statusText"></span><progress id="prog" max="100" hidden></progress></div>
    <div id="error" hidden role="alert"><span id="errorText"></span><button id="retry" type="button">Spróbuj ponownie</button></div>
  </section>

  <section id="transport">
    <div><span id="timeNow" class="tnum">0:00</span><span id="timeTotal" class="tnum dim">/ 0:00</span></div>
    <div id="controls">
      <button id="back" type="button" title="−5 s (strzałka w lewo)">−5 s</button>
      <button id="playBtn" type="button" title="Odtwarzaj / pauza (Spacja)" disabled>▶ Odtwarzaj</button>
      <button id="fwd" type="button" title="+5 s (strzałka w prawo)">+5 s</button>
    </div>
  </section>

  <section class="group">
    <h2>Ścieżka z klikami</h2>
    <div id="tracks" class="tracks" role="group" aria-label="Ścieżka z klikami"></div>
  </section>

  <section id="timeline" aria-label="Oś czasu — kliknij, aby przewinąć">
    <canvas id="tl"></canvas>
    <div id="playhead"></div>
  </section>

  <section id="volumes">
    <label class="vol">Muzyka <input id="volMusic" type="range" min="0" max="1" step="0.01" value="0.8"></label>
    <label class="vol">Kliki <input id="volClick" type="range" min="0" max="1" step="0.01" value="0.8"></label>
  </section>

  <p class="keys">Klawisze: <kbd>1</kbd>–<kbd>7</kbd> wybór ścieżki, <kbd>Spacja</kbd> odtwarzanie, <kbd>←</kbd> <kbd>→</kbd> ±5 s.</p>
</main>
<script type="module" src="listen.js"></script>
</body>
</html>
